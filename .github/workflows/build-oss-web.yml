name: build-oss-web-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build the web image from"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push appflowy_web (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nextc/appflowy_web:${{ inputs.ref }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
